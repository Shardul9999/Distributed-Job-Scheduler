[pytest]
testpaths = tests
asyncio_mode = auto
# Each test gets its own event loop. Session-scoped loops leak state between
# async tests -- a connection opened in one test and cleaned up in another is a
# reliable source of failures that only appear when the suite runs in full.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:testcontainers.*
markers =
    slow: tests that start containers or spawn a worker fleet
