# Local topology for the distributed job scheduler.
#
# Day 0 brings up PostgreSQL and the API. The worker, scheduler and dashboard
# services are added on Days 1-3; their configuration surface already exists in
# .env.example so adding them is a compose change, not a redesign.

name: codity

services:
  postgres:
    image: postgres:16-alpine
    container_name: codity-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codity}
    ports:
      # Exposed so you can attach psql or a GUI client from the host while
      # inspecting the claim query.
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API's depends_on waits on this. Without a real readiness check,
      # containers start before PostgreSQL finishes initialising and the first
      # migration fails on a connection refused.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codity} -d ${POSTGRES_DB:-codity}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      # Raised from the default 100. Every API replica and every worker holds a
      # pool; the default ceiling is reached quickly once the fleet scales.
      - "postgres"
      - "-c"
      - "max_connections=200"
      # Log any statement slower than 200ms. Useful while tuning the claim
      # query on Day 1 -- it makes a missed index immediately visible.
      - "-c"
      - "log_min_duration_statement=200"
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
    container_name: codity-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-codity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codity}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_only_secret_change_me_in_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # The API is the single migration owner; workers added later will not set
      # this, so they cannot race it for the alembic_version row.
      RUN_MIGRATIONS: "true"
      # AI failure summaries (bonus). Optional: leave the keys empty and the
      # feature is inert. Set one to enable it -- no rebuild needed.
      AI_SUMMARY_PROVIDER: ${AI_SUMMARY_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind-mount for autoreload during development. Removed in a production
      # compose file, where the image is immutable.
      - .:/app
    entrypoint: ["bash", "/app/scripts/entrypoint.sh"]
    command:
      - "uvicorn"
      - "apps.api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-codity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codity}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-100}
      WORKER_HEARTBEAT_INTERVAL_S: ${WORKER_HEARTBEAT_INTERVAL_S:-10}
      WORKER_SHUTDOWN_GRACE_S: ${WORKER_SHUTDOWN_GRACE_S:-30}
      # Workers never own migrations -- the API applies them. Several replicas
      # racing for the alembic_version row would deadlock on startup.
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    entrypoint: ["bash", "/app/scripts/entrypoint.sh"]
    command: ["python", "-m", "apps.worker.main"]
    # Docker's default is 10s, which would SIGKILL a worker mid-drain and
    # strand its jobs until the visibility timeout expired. This must exceed
    # WORKER_SHUTDOWN_GRACE_S.
    stop_grace_period: 45s
    # No container_name: that would prevent scaling past one replica.
    # Three by default so `docker compose up -d` alone produces the topology
    # the README describes -- a fleet competing for the same jobs, which is the
    # whole point of the claim query. Override with `--scale worker=N`.
    deploy:
      replicas: 3
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-codity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codity}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Cron resolution. One second is the finest a five-field cron expression
      # can express, so ticking faster would only add load.
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-1000}
      # How long a standby waits before trying for the leader lock again.
      SCHEDULER_LOCK_RETRY_S: ${SCHEDULER_LOCK_RETRY_S:-5}
      # Reaper cadence. Must be well below the shortest visibility timeout,
      # or a job can sit orphaned for longer than its queue promised.
      REAPER_INTERVAL_S: ${REAPER_INTERVAL_S:-15}
      # A worker missing this many seconds of heartbeats is declared dead. Six
      # times WORKER_HEARTBEAT_INTERVAL_S: long enough that a GC pause or a
      # brief database blip does not evict a healthy worker, short enough that
      # a real crash is recovered inside a minute.
      WORKER_HEARTBEAT_TIMEOUT_S: ${WORKER_HEARTBEAT_TIMEOUT_S:-60}
      HEARTBEAT_RETENTION_HOURS: ${HEARTBEAT_RETENTION_HOURS:-24}
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    entrypoint: ["bash", "/app/scripts/entrypoint.sh"]
    command: ["python", "-m", "apps.scheduler.main"]
    # Two replicas by default, and that is the point: only one wins
    # pg_try_advisory_lock, the other logs `scheduler.standby` and waits. Kill
    # the leader and the standby takes over within SCHEDULER_LOCK_RETRY_S,
    # because the lock dies with the leader's database session.
    deploy:
      replicas: 2
    # No container_name, for the same reason as the worker: it would block
    # scaling to more than one replica.
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: codity-web
    depends_on:
      api:
        condition: service_started
    environment:
      # As seen from the *browser*, not from inside the container: the dashboard
      # calls the API directly over CORS at the host-exposed port. The API
      # already allow-lists http://localhost:3000.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Live source for dev autoreload, but keep the container's own Linux-built
      # node_modules and .next -- the host copies are Windows binaries (sharp,
      # the Next SWC toolchain) and would break inside the Alpine container.
      - ./apps/web:/app/web
      - /app/web/node_modules
      - /app/web/.next
    restart: unless-stopped

volumes:
  postgres_data:
