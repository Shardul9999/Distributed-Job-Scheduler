name: CI

# The test suite is the claim this project rests on -- "10 workers, 500 jobs,
# every job exactly once". Running it here means that claim is demonstrated on
# every push rather than asserted in a README badge somebody typed by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So the suite can be re-run against an unchanged tree when something external
  # (a base image, a transitive dependency) is suspected.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-latest

    # A real PostgreSQL 16, matching docker-compose, because the behaviour under
    # test only exists here: FOR UPDATE SKIP LOCKED, partial indexes, advisory
    # locks, ON CONFLICT against a partial unique index. SQLite would implement
    # none of it and a mock would assert only that the mock works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codity
          POSTGRES_PASSWORD: codity_dev_password
          POSTGRES_DB: codity_test
        ports:
          - 5432:5432
        # Without the health check, the first migration can race the server's
        # startup and fail on a connection refused.
        options: >-
          --health-cmd "pg_isready -U codity -d codity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py uses this when present and falls back to Testcontainers when
      # not -- which is what lets the identical suite run here, inside the API
      # container, and on a laptop.
      TEST_DATABASE_URL: postgresql+asyncpg://codity:codity_dev_password@localhost:5432/codity_test
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile. asyncpg wheels lag new interpreters, which is
          # the reason this is pinned rather than tracking latest.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        # Applied by Alembic, not Base.metadata.create_all: those two can drift,
        # and it is the migration that ships.
        env:
          POSTGRES_USER: codity
          POSTGRES_PASSWORD: codity_dev_password
          POSTGRES_DB: codity_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -q

  typecheck:
    name: frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: tsc --noEmit
        working-directory: apps/web
        run: npx tsc --noEmit -p .

  build:
    name: docker compose builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The quick-start promise is `docker compose up`, so a broken image is a
      # broken submission even with every test green.
      - name: Build images
        run: docker compose build
