[alembic]
script_location = packages/db/migrations
# Explicit, because the legacy fallback splits on spaces and commas too
# and warns on every run.
path_separator = os
prepend_sys_path = .

# Timestamped, ordered revision filenames. Default Alembic names files by a
# random hash alone, which makes `ls versions/` useless for seeing the order
# migrations were written in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# The URL is assembled from environment variables in env.py so that the same
# migration set runs against dev, test containers and CI without editing a file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
